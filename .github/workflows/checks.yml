name: Check workflow and frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_BASE_PATH: /Vishwas-Setu/
          VITE_PAGES: 'true'
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
      - name: Start local backend and Pages preview
        run: |
          (cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1) &
          (cd frontend && npm run preview -- --host 127.0.0.1 > /tmp/frontend.log 2>&1) &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/api/health && curl -fsS http://127.0.0.1:4173/Vishwas-Setu/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log /tmp/frontend.log
          exit 1
        env:
          CORS_ORIGINS: http://127.0.0.1:4173
          VITE_BASE_PATH: /Vishwas-Setu/
      - name: Test login, role screens, downloads and navigation
        run: npm run test:smoke -- http://127.0.0.1:4173/Vishwas-Setu
        working-directory: frontend
        env:
          SMOKE_HASH: 'true'
